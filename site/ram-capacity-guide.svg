<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" fill="none">
  <rect width="800" height="280" fill="#0f1117"/>
  <text x="400" y="30" text-anchor="middle" fill="#f0f6fc" font-family="system-ui" font-size="18" font-weight="700">How Much RAM Do You Need?</text>
  
  <!-- 16GB -->
  <rect x="40" y="55" width="220" height="200" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="150" y="85" text-anchor="middle" fill="#58a6ff" font-family="system-ui" font-size="28" font-weight="800">16GB</text>
  <text x="150" y="108" text-anchor="middle" fill="#8b949e" font-family="system-ui" font-size="11">Budget & Casual</text>
  <line x1="70" y1="118" x2="230" y2="118" stroke="#21262d"/>
  <text x="70" y="140" fill="#e1e4e8" font-family="system-ui" font-size="11">✓ Web browsing</text>
  <text x="70" y="158" fill="#e1e4e8" font-family="system-ui" font-size="11">✓ Office work</text>
  <text x="70" y="176" fill="#e1e4e8" font-family="system-ui" font-size="11">✓ Light gaming</text>
  <text x="70" y="194" fill="#d29922" font-family="system-ui" font-size="11">⚠ Multitasking limits</text>
  <text x="150" y="230" text-anchor="middle" fill="#58a6ff" font-family="system-ui" font-size="16" font-weight="700">$22–35</text>
  <text x="150" y="248" text-anchor="middle" fill="#8b949e" font-family="system-ui" font-size="10">DDR4 / DDR5</text>
  
  <!-- 32GB -->
  <rect x="290" y="55" width="220" height="200" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="3"/>
  <rect x="290" y="55" width="220" height="24" rx="10" fill="#238636" opacity="0.3"/>
  <text x="400" y="73" text-anchor="middle" fill="#3fb950" font-family="system-ui" font-size="10" font-weight="700">⭐ SWEET SPOT</text>
  <text x="400" y="110" text-anchor="middle" fill="#3fb950" font-family="system-ui" font-size="28" font-weight="800">32GB</text>
  <text x="400" y="133" text-anchor="middle" fill="#8b949e" font-family="system-ui" font-size="11">Gaming & Productivity</text>
  <line x1="320" y1="143" x2="480" y2="143" stroke="#21262d"/>
  <text x="320" y="165" fill="#e1e4e8" font-family="system-ui" font-size="11">✓ AAA gaming</text>
  <text x="320" y="183" fill="#e1e4e8" font-family="system-ui" font-size="11">✓ Video editing</text>
  <text x="320" y="201" fill="#e1e4e8" font-family="system-ui" font-size="11">✓ Heavy multitasking</text>
  <text x="400" y="240" text-anchor="middle" fill="#3fb950" font-family="system-ui" font-size="16" font-weight="700">$45–90</text>
  <text x="400" y="258" text-anchor="middle" fill="#8b949e" font-family="system-ui" font-size="10">DDR4 / DDR5</text>
  
  <!-- 64GB -->
  <rect x="540" y="55" width="220" height="200" rx="10" fill="#161b22" stroke="#bc8cff" stroke-width="2"/>
  <text x="650" y="85" text-anchor="middle" fill="#bc8cff" font-family="system-ui" font-size="28" font-weight="800">64GB</text>
  <text x="650" y="108" text-anchor="middle" fill="#8b949e" font-family="system-ui" font-size="11">Workstation & Pro</text>
  <line x1="570" y1="118" x2="730" y2="118" stroke="#21262d"/>
  <text x="570" y="140" fill="#e1e4e8" font-family="system-ui" font-size="11">✓ 4K/8K video editing</text>
  <text x="570" y="158" fill="#e1e4e8" font-family="system-ui" font-size="11">✓ 3D rendering</text>
  <text x="570" y="176" fill="#e1e4e8" font-family="system-ui" font-size="11">✓ VMs & containers</text>
  <text x="570" y="194" fill="#e1e4e8" font-family="system-ui" font-size="11">✓ ML model training</text>
  <text x="650" y="230" text-anchor="middle" fill="#bc8cff" font-family="system-ui" font-size="16" font-weight="700">$90–180</text>
  <text x="650" y="248" text-anchor="middle" fill="#8b949e" font-family="system-ui" font-size="10">DDR5 recommended</text>
</svg>