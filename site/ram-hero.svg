<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" fill="none">
  <rect width="800" height="350" fill="#0f1117"/>
  
  <!-- RAM stick illustration -->
  <rect x="280" y="40" width="240" height="160" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <rect x="290" y="50" width="220" height="140" rx="4" fill="#0d1117"/>
  
  <!-- RAM chips -->
  <rect x="300" y="65" width="40" height="25" rx="3" fill="#1f6feb" opacity="0.4"/>
  <rect x="350" y="65" width="40" height="25" rx="3" fill="#1f6feb" opacity="0.4"/>
  <rect x="400" y="65" width="40" height="25" rx="3" fill="#1f6feb" opacity="0.4"/>
  <rect x="450" y="65" width="40" height="25" rx="3" fill="#1f6feb" opacity="0.4"/>
  
  <rect x="300" y="100" width="40" height="25" rx="3" fill="#1f6feb" opacity="0.4"/>
  <rect x="350" y="100" width="40" height="25" rx="3" fill="#1f6feb" opacity="0.4"/>
  <rect x="400" y="100" width="40" height="25" rx="3" fill="#1f6feb" opacity="0.4"/>
  <rect x="450" y="100" width="40" height="25" rx="3" fill="#1f6feb" opacity="0.4"/>
  
  <!-- Pins -->
  <rect x="310" y="160" width="4" height="30" rx="2" fill="#30363d"/>
  <rect x="330" y="160" width="4" height="30" rx="2" fill="#30363d"/>
  <rect x="350" y="160" width="4" height="30" rx="2" fill="#30363d"/>
  <rect x="370" y="160" width="4" height="30" rx="2" fill="#30363d"/>
  <rect x="430" y="160" width="4" height="30" rx="2" fill="#30363d"/>
  <rect x="450" y="160" width="4" height="30" rx="2" fill="#30363d"/>
  <rect x="470" y="160" width="4" height="30" rx="2" fill="#30363d"/>
  <rect x="490" y="160" width="4" height="30" rx="2" fill="#30363d"/>
  
  <!-- Labels -->
  <text x="400" y="145" text-anchor="middle" fill="#58a6ff" font-family="system-ui" font-size="14" font-weight="700">DDR5 32GB 6000MHz</text>
  <text x="400" y="220" text-anchor="middle" fill="#f0f6fc" font-family="system-ui" font-size="24" font-weight="800">Find the Cheapest RAM</text>
  <text x="400" y="248" text-anchor="middle" fill="#8b949e" font-family="system-ui" font-size="14">Compare prices across DDR4 &amp; DDR5 — updated daily</text>
  
  <!-- Price tags -->
  <rect x="100" y="270" width="140" height="50" rx="8" fill="#161b22" stroke="#3fb950"/>
  <text x="170" y="292" text-anchor="middle" fill="#8b949e" font-family="system-ui" font-size="10">DDR4 32GB from</text>
  <text x="170" y="310" text-anchor="middle" fill="#3fb950" font-family="system-ui" font-size="18" font-weight="800">$45</text>
  
  <rect x="330" y="270" width="140" height="50" rx="8" fill="#161b22" stroke="#58a6ff"/>
  <text x="400" y="292" text-anchor="middle" fill="#8b949e" font-family="system-ui" font-size="10">DDR5 32GB from</text>
  <text x="400" y="310" text-anchor="middle" fill="#58a6ff" font-family="system-ui" font-size="18" font-weight="800">$62</text>
  
  <rect x="560" y="270" width="140" height="50" rx="8" fill="#161b22" stroke="#bc8cff"/>
  <text x="630" y="292" text-anchor="middle" fill="#8b949e" font-family="system-ui" font-size="10">DDR5 64GB from</text>
  <text x="630" y="310" text-anchor="middle" fill="#bc8cff" font-family="system-ui" font-size="18" font-weight="800">$110</text>
