<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" fill="none">
  <rect width="800" height="280" fill="#0f1117"/>
  <text x="400" y="30" text-anchor="middle" fill="#f0f6fc" font-family="system-ui" font-size="18" font-weight="700">RAM Speed vs Latency — What Matters More?</text>
  
  <!-- Speed bar -->
  <text x="50" y="80" fill="#8b949e" font-family="system-ui" font-size="12">Speed (MHz)</text>
  <rect x="150" y="65" width="600" height="20" rx="4" fill="#161b22" stroke="#30363d"/>
  <rect x="150" y="65" width="450" height="20" rx="4" fill="url(#speedGrad)"/>
  <text x="610" y="80" fill="#58a6ff" font-family="system-ui" font-size="11" font-weight="700">Higher = more bandwidth</text>
  
  <!-- Latency bar -->
  <text x="50" y="130" fill="#8b949e" font-family="system-ui" font-size="12">Latency (CL)</text>
  <rect x="150" y="115" width="600" height="20" rx="4" fill="#161b22" stroke="#30363d"/>
  <rect x="150" y="115" width="200" height="20" rx="4" fill="url(#latencyGrad)"/>
  <text x="360" y="130" fill="#3fb950" font-family="system-ui" font-size="11" font-weight="700">Lower = less delay</text>
  
  <!-- Real latency comparison -->
  <text x="400" y="175" text-anchor="middle" fill="#f0f6fc" font-family="system-ui" font-size="14" font-weight="600">True Latency = CL / (MHz / 2) × 1000</text>
  
  <rect x="100" y="195" width="170" height="55" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="185" y="215" text-anchor="middle" fill="#8b949e" font-family="system-ui" font-size="11">DDR4-3200 CL16</text>
  <text x="185" y="238" text-anchor="middle" fill="#f0f6fc" font-family="system-ui" font-size="16" font-weight="700">10.0ns</text>
  
  <rect x="315" y="195" width="170" height="55" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="400" y="215" text-anchor="middle" fill="#8b949e" font-family="system-ui" font-size="11">DDR5-6000 CL36</text>
  <text x="400" y="238" text-anchor="middle" fill="#f0f6fc" font-family="system-ui" font-size="16" font-weight="700">12.0ns</text>
  
  <rect x="530" y="195" width="170" height="55" rx="8" fill="#161b22" stroke="#3fb950"/>
  <text x="615" y="215" text-anchor="middle" fill="#3fb950" font-family="system-ui" font-size="11">DDR5-6000 CL30</text>
  <text x="615" y="238" text-anchor="middle" fill="#3fb950" font-family="system-ui" font-size="16" font-weight="700">10.0ns</text>
  
  <defs>
    <linearGradient id="speedGrad" x1="0" x2="1"><stop offset="0%" stop-color="#1f6feb"/><stop offset="100%" stop-color="#58a6ff"/></linearGradient>
    <linearGradient id="latencyGrad" x1="0" x2="1"><stop offset="0%" stop-color="#238636"/><stop offset="100%" stop-color="#3fb950"/></linearGradient>
  </defs>
</svg>