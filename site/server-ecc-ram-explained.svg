<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" fill="none">
  <rect width="800" height="300" fill="#0f1117"/>
  <text x="400" y="30" text-anchor="middle" fill="#f0f6fc" font-family="system-ui" font-size="18" font-weight="700">Server & ECC RAM — When You Need It</text>
  
  <!-- ECC vs Non-ECC comparison -->
  <rect x="40" y="55" width="340" height="220" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="210" y="85" text-anchor="middle" fill="#3fb950" font-family="system-ui" font-size="16" font-weight="700">ECC RAM</text>
  <text x="210" y="105" text-anchor="middle" fill="#8b949e" font-family="system-ui" font-size="11">Error Correcting Code</text>
  <text x="70" y="140" fill="#e1e4e8" font-family="system-ui" font-size="12">✓ Detects AND corrects bit flips</text>
  <text x="70" y="162" fill="#e1e4e8" font-family="system-ui" font-size="12">✓ Prevents data corruption</text>
  <text x="70" y="184" fill="#e1e4e8" font-family="system-ui" font-size="12">✓ Essential for servers & databases</text>
  <text x="70" y="206" fill="#e1e4e8" font-family="system-ui" font-size="12">✓ 24/7 uptime reliability</text>
  <text x="70" y="238" fill="#d29922" font-family="system-ui" font-size="12">⚠ Costs 10-20% more</text>
  <text x="70" y="260" fill="#d29922" font-family="system-ui" font-size="12">⚠ Requires motherboard support</text>
  
  <rect x="420" y="55" width="340" height="220" rx="10" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
  <text x="590" y="85" text-anchor="middle" fill="#8b949e" font-family="system-ui" font-size="16" font-weight="700">Non-ECC RAM</text>
  <text x="590" y="105" text-anchor="middle" fill="#8b949e" font-family="system-ui" font-size="11">Standard Consumer RAM</text>
  <text x="450" y="140" fill="#e1e4e8" font-family="system-ui" font-size="12">✗ No error correction</text>
  <text x="450" y="162" fill="#e1e4e8" font-family="system-ui" font-size="12">✓ Cheaper per GB</text>
  <text x="450" y="184" fill="#e1e4e8" font-family="system-ui" font-size="12">✓ Works in any desktop</text>
  <text x="450" y="206" fill="#e1e4e8" font-family="system-ui" font-size="12">✓ Higher speeds available</text>
  <text x="450" y="238" fill="#3fb950" font-family="system-ui" font-size="12">✓ Fine for gaming & home use</text>
  <text x="450" y="260" fill="#3fb950" font-family="system-ui" font-size="12">✓ No special requirements</text>
</svg>